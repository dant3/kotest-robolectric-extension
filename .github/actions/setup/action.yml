name: Setup build
description: JDK, Gradle and Robolectric android-all caches.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v6
    # Robolectric downloads android-all jars into the local Maven repo at test time.
    - uses: actions/cache@v6
      with:
        path: ~/.m2/repository/org/robolectric
        key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: robolectric-
